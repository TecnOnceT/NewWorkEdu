<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dərslik Portalı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    <div class="bg-grid" aria-hidden="true"></div>

    <div class="dashboard-container">
        <header>
            <div class="logo-container" style="margin-bottom: 0;">
                <img src="OCKER2.png" style="width: 140px; height: auto;" alt="Logo" class="logo-img">
                <div class="logo-text">Portal</div>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <h1 style="font-size: 16px; font-weight: 500; color: #ffffff;">
                    Xoş gəldin, <span id="user-display" style="color:#fca5a5; font-weight: 700;">Tələbə</span>!
                </h1>
                <button class="btn-danger" onclick="logout()">Çıxış Et</button>
            </div>
        </header>
        
        <h2 style="margin-bottom: 24px; color: #ffffff; font-weight: 600;">Dərslikləriniz:</h2>
        
        <div class="courses-grid">
            <div class="course-card">
                <h3>HTML 1-ci Dərs</h3>
                <p>Dərs materialını sayt üzərindən oxuya və ya aşağıdakı düymələrdən tam ekran baxıb yükləyə bilərsiniz.</p>
                
                <div class="pdf-viewer-container">
                    <iframe id="pdf-frame-1" src="HTML-1.pdf" allowfullscreen></iframe>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="openFullscreen('pdf-frame-1')">Tam Ekran Oxu</button>
                    <a href="HTML-1.pdf" download class="btn-primary btn-download" style="padding-top: 13px;">PDF Yüklə</a>
                </div>
            </div>
        </div>

        <h2 class="editor-title">HTML & CSS Eksperiment Sahəsi:</h2>
        
        <div class="editor-container">
            <div class="editor-column">
                <div class="code-box">
                    <label for="html-code">HTML Kodu:</label>
                    <textarea id="html-code" spellcheck="false"><h1>Salam Dünya!</h1>
<p>Bu mənim ilk eksperimentimdir.</p>
<button>Düymə</button></textarea>
                </div>

                <div class="code-box">
                    <label for="css-code">CSS Kodu:</label>
                    <textarea id="css-code" spellcheck="false">h1 {
                          color: #fca5a5;
                          font-family: sans-serif;
                        }
                        p {
                          color: #ffffff;
                        }
                        button {
                          background: #ef4444;
                          color: white;
                          border: none;
                          padding: 8px 16px;
                          border-radius: 6px;
                          cursor: pointer;
                        }</textarea>
                </div>
            </div>

            <div class="preview-column">
                <label>Canlı Nəticə (Preview):</label>
                <iframe id="live-preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem("currentUser");
        if (currentUser) {
            document.getElementById("user-display").textContent = currentUser;
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function openFullscreen(iframeId) {
            const iframe = document.getElementById(iframeId);
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        }

        const htmlInput = document.getElementById("html-code");
        const cssInput = document.getElementById("css-code");
        const previewFrame = document.getElementById("live-preview");

        function updatePreview() {
            const htmlValue = htmlInput.value;
            const cssValue = cssInput.value;
            
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            previewDoc.open();
            previewDoc.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <style>${cssValue}</style>
                </head>
                <body>
                    ${htmlValue}
                </body>
                </html>
            `);
            previewDoc.close();
        }

        htmlInput.addEventListener("input", updatePreview);
        cssInput.addEventListener("input", updatePreview);
        window.addEventListener("DOMContentLoaded", updatePreview);
    </script>
</body>
</html>
