<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dərslik Portalı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="dashboard-container">
        <header>
            <div class="logo-container" style="margin-bottom: 0;">
                <img src="OCKER2.png" height="129" alt="Logo" class="logo-img">
                <div class="logo-text">Portal</div>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <h1 style="font-size: 18px; font-weight: 500;">
                    Xoş gəldin, <span id="user-display" style="color:#fca5a5; font-weight: 700;"></span> 
                    <span id="role-badge" style="font-size: 12px; opacity: 0.8;"></span>!
                </h1>
                <button class="btn-danger" onclick="logout()">Çıxış Et</button>
            </div>
        </header>

        <div id="teacher-panel" class="admin-section" style="display: none;">
            <h2 style="color: #fca5a5; margin-bottom: 10px;">Məllim İdarəetmə Paneli</h2>
            <p style="font-size: 14px; opacity: 0.8;">Tələbələrin dərslərini aktivləşdirin və qiymətləndirin:</p>
            
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Tələbə</th>
                        <th>Dərs Statusu</th>
                        <th>1-ci Dərs Qiyməti</th>
                        <th>2-ci Dərs Qiyməti</th>
                        <th>Əməliyyat</th>
                    </tr>
                </thead>
                <tbody id="student-list">
                </tbody>
            </table>
        </div>

        <h2 style="margin-bottom: 24px; color: #ffffff; font-weight: 600;">Dərslikləriniz:</h2>
        
        <div class="courses-grid" id="courses-container">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
