<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Səhifəsi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-shapes" id="bgShapes"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <div class="login-card">
        <div class="logo-container">
            <img src="OCKER2.png" style="width: 140px; height: auto;" alt="Logo" class="logo-img">
            <div class="logo-text"></div>
        </div>

        <h2>Sistemə Giriş</h2>
        
        <div class="input-group">
            <label for="username">İstifadəçi adı</label>
            <input type="text" id="username" placeholder="Məs: Smbdy" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="password">Şifrə</label>
            <input type="password" id="password" placeholder="Şifrəniz">
        </div>

        <button class="btn-primary" id="login-btn">Giriş Et</button>
        <p id="error-msg" class="error-msg"></p>
    </div>

<script src="script.js"></script>
</body>
</html>
