<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dərslik Portalı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <div class="logo-container" style="margin-bottom: 0;">
                <img src="OCKER2.png" alt="Logo" class="logo-img">
                <div class="logo-text">Portal</div>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <h1 style="font-size: 16px; font-weight: 500; color: #ffffff;">
                    Xoş gəldin, <span id="user-display" style="color:#fca5a5; font-weight: 700;">Tələbə</span>!
                </h1>
                <button class="btn-danger" onclick="logout()">Çıxış Et</button>
            </div>
        </header>

        <!-- DƏRSLİK BÖLÜMÜ -->
        <h2 style="margin-bottom: 24px; color: #ffffff; font-weight: 600;">Dərslikləriniz:</h2>
        
        <div class="courses-grid">
            <div class="course-card">
                <h3>HTML 1-ci Dərs</h3>
                <p>Dərs materialını sayt üzərindən oxuya və ya aşağıdakı düymələrdən tam ekran baxıb yükləyə bilərsiniz.</p>
                
                <!-- Genişləndirilmiş PDF Oxuyucu -->
                <div class="pdf-viewer-container">
                    <iframe id="pdf-frame-1" src="cpp.pdf" allowfullscreen></iframe>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="openFullscreen('pdf-frame-1')">🖥️ Tam Ekran Oxu</button>
                    <a href="cpp.pdf" download class="btn-primary btn-download">📥 PDF Yüklə</a>
                </div>
            </div>
        </div>

        <!-- HTML / CSS CANLI EKSPERİMENT SAHƏSİ -->
        <h2 style="margin: 40px 0 20px 0; color: #ffffff; font-weight: 600;">🧪 HTML & CSS Eksperiment Sahəsi:</h2>
        
        <div class="editor-container">
            <div class="editor-box">
                <label for="html-code">HTML Kodu:</label>
                <textarea id="html-code" placeholder="<h1>Salam Dünya!</h1>" spellcheck="false"><h1>Salam Dünya!</h1>
<p>Bu mənim ilk eksperimentimdir.</p>
<button>Düymə</button></textarea>

                <label for="css-code" style="margin-top: 10px;">CSS Kodu:</label>
                <textarea id="css-code" placeholder="h1 { color: red; }" spellcheck="false">h1 {
  color: #fca5a5;
  font-family: sans-serif;
}
button {
  background: #ef4444;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
}</textarea>
            </div>

            <div class="preview-box">
                <label>Canlı Nəticə (Preview):</label>
                <iframe id="live-preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        // User və Logout Məntiqi
        document.addEventListener("DOMContentLoaded", function() {
            const currentUser = localStorage.getItem("currentUser");
            if (currentUser) {
                document.getElementById("user-display").textContent = currentUser;
            }
            updatePreview(); // İlk yüklənmədə canlı görünüşü yaradın
        });

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "login.html";
        }

        function openFullscreen(iframeId) {
            const iframe = document.getElementById(iframeId);
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        }

        // Canlı Redaktor Məntiqi
        const htmlCode = document.getElementById("html-code");
        const cssCode = document.getElementById("css-code");
        const previewFrame = document.getElementById("live-preview");

        function updatePreview() {
            const html = htmlCode.value;
            const css = `<style>${cssCode.value}</style>`;
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            
            previewDoc.open();
            previewDoc.write(html + css);
            previewDoc.close();
        }

        htmlCode.addEventListener("input", updatePreview);
        cssCode.addEventListener("input", updatePreview);
    </script>
</body>
</html>
