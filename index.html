<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Səhifəsi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-shapes" id="bgShapes"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <div class="login-card">
        <div class="logo-container">
            <img src="OCKER2.png" style="width: 140px; height: auto;" alt="Logo" class="logo-img">
            <div class="logo-text"></div>
        </div>

        <h2>Sistemə Giriş</h2>
        
        <div class="input-group">
            <label for="username">İstifadəçi adı</label>
            <input type="text" id="username" placeholder="Məs: Smbdy" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="password">Şifrə</label>
            <input type="password" id="password" placeholder="Şifrəniz">
        </div>

        <button class="btn-primary" id="login-btn">Giriş Et</button>
        <p id="error-msg" class="error-msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzfpUCfUJd4VNR_UfrR3BhQ8ZCV5jZsP8",
          authDomain: "neworkaccountprojet.firebaseapp.com",
          projectId: "neworkaccountprojet",
          storageBucket: "neworkaccountprojet.firebasestorage.app",
          messagingSenderId: "962982050109",
          appId: "1:962982050109:web:6886bb8c095a6f28a16d54",
          measurementId: "G-RKRB3JEJ4G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        localStorage.removeItem("currentUser");

        document.addEventListener("DOMContentLoaded", function () {
            createGeometricShapes();
        });

        function createGeometricShapes() {
            const container = document.getElementById("bgShapes");
            if (!container) return;

            const shapeTypes = ["square", "circle", "triangle", "diamond"];
            const totalShapes = 20;

            for (let i = 0; i < totalShapes; i++) {
                const shape = document.createElement("div");
                const randomType = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
                
                shape.classList.add("shape", randomType);

                const size = Math.floor(Math.random() * 40) + 20;
                if (randomType !== "triangle") {
                    shape.style.width = `${size}px`;
                    shape.style.height = `${size}px`;
                }

                shape.style.left = `${Math.random() * 100}%`;
                const duration = Math.random() * 12 + 6;
                shape.style.animationDuration = `${duration}s`;
                const delay = Math.random() * 10;
                shape.style.animationDelay = `${delay}s`;

                container.appendChild(shape);
            }
        }

        document.getElementById("login-btn").addEventListener("click", () => {
            const userInput = document.getElementById("username").value.trim();
            const passInput = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");

            if (!userInput || !passInput) {
                errorMsg.textContent = "Zəhmət olmasa bütün xanaları doldurun!";
                return;
            }

            errorMsg.textContent = "Yoxlanılır...";
            const formattedEmail = `${userInput}@nework.edu`;

            signInWithEmailAndPassword(auth, formattedEmail, passInput)
                .then((userCredential) => {
                    localStorage.setItem("currentUser", userInput);
                    window.location.href = "second.html";
                })
                .catch((error) => {
                    console.error("Firebase Hatası:", error);
                    errorMsg.textContent = "İstifadəçi adı və ya şifrə yanlışdır!";
                });
        });
    </script>
</body>
</html>
