<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dərslik Portalı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header>
            <div class="logo-container" style="margin-bottom: 0;">
                <img src="OCKER2.png" alt="Logo" class="logo-img">
                <div class="logo-text">Portal</div>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <h1 style="font-size: 16px; font-weight: 500; color: #ffffff;">
                    Xoş gəldin, <span id="user-display" style="color:#fca5a5; font-weight: 700;">Tələbə</span>!
                </h1>
                <button class="btn-danger" onclick="logout()">Çıxış Et</button>
            </div>
        </header>

    <h2 class="editor-title"> HTML & CSS Eksperiment Sahəsi:</h2>
    
    <div class="editor-container">
        <div class="editor-column">
            <div class="code-box">
                <label for="html-code">HTML Kodu:</label>
                <textarea id="html-code" spellcheck="false"><h1>Salam Dünya!</h1>
    <p>Bu mənim ilk eksperimentimdir.</p>
    <button>Düymə</button></textarea>
            </div>
    
            <div class="code-box">
                <label for="css-code">CSS Kodu:</label>
                <textarea id="css-code" spellcheck="false">h1 {
      color: #fca5a5;
      font-family: sans-serif;
    }
    p {
      color: #ffffff;
    }
    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }</textarea>
            </div>
        </div>
    
        <div class="preview-column">
            <label>Canlı Nəticə (Preview):</label>
            <iframe id="live-preview"></iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
