<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Səhifəsi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="login-card">
		<!-- LOGO BÖLÜMÜ -->
		<div class="logo-container">
			<img src="OCKER2.png" height="120">
			<div class="logo-text">Portal</div>
		</div>

		<h2>Sistemə Giriş</h2>
		...
        
        <div class="input-group">
            <label for="username">İstifadəçi adı</label>
            <input type="text" id="username" placeholder="Məs: ali">
        </div>

        <div class="input-group">
            <label for="password">Şifrə</label>
            <input type="password" id="password" placeholder="Məs: 123">
        </div>

        <button class="btn-primary" onclick="login()">Giriş Et</button>
        <p id="error-msg" class="error-msg"></p>
    </div>

	<script>
	    // 1. Səhifə açılanda aktiv sessiyanı sıfırlayırıq
	    localStorage.removeItem("currentUser");
	
	    // 2. Əgər brauzerdə istifadəçi siyahısı yoxdursa, ilkin test istifadəçilərini yaradırıq.
	    // Məlumatlar JS kodunda yox, yerli yaddaşda saxlanılacaq.
	    if (!localStorage.getItem("siteUsers")) {
	        const initialUsers = [
	            { username: "NurgunF", password: "N6gunTVT23" },
	            { username: "SenanPS", password: "Sena4nCatssep" },
	            { username: "NermenSD", password: "Nerm3nOP90" },
	            { username: "Ayseen", password: "Ays4nPreps132" },
	            { username: "Ulvid", password: "Ulv3Braku1378" },
	            { username: "Aytac0", password: "Ayt4cJUKte34" },
	            { username: "T0T", password: "T0T" }
	        ];
	        localStorage.setItem("siteUsers", JSON.stringify(initialUsers));
	    }
	
	    function login() {
	        const userInput = document.getElementById("username").value.trim();
	        const passInput = document.getElementById("password").value.trim();
	        const errorMsg = document.getElementById("error-msg");
	
	        // İstifadəçi siyahısını fayldan yox, yerli yaddaşdan çəkirik
	        const users = JSON.parse(localStorage.getItem("siteUsers")) || [];
	
	        const foundUser = users.find(u => u.username === userInput && u.password === passInput);
	
	        if (foundUser) {
	            localStorage.setItem("currentUser", foundUser.username);
	            window.location.href = "index.html";
	        } else {
	            errorMsg.textContent = "İstifadəçi adı və ya şifrə yanlışdır!";
	        }
	    }
	</script>

</body>
</html>
